name: 邮箱保活

# 每周一 11:23（北京时间）自动登录一次，防止"连续一年未登录"被禁用。
# GitHub 定时任务可能延迟几分钟到几十分钟，属正常现象。
# 每次运行把脚本输出直接打进 Actions 日志（日志可随时删除）；
# 同时脚本按 RESULT_FILE 只写一行摘要（运行时间/成功与否/最新邮件时间），
# 该文件提交进仓库——进入 git 历史的内容不便删除，所以只留最小信息。
on:
  schedule:
    - cron: "23 3 * * 1" # UTC 03:23 = 北京时间 11:23
  workflow_dispatch: # 支持在 Actions 页面手动触发

env:
  MIHOMO_VERSION: "v1.19.34" # 固定版本，升级需手动修改

# contents: write 仅用于提交 result.txt 运行记录
permissions:
  contents: write

concurrency:
  group: mail-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 官方 action，且运行时 Secrets 尚未进入环境（Secrets 仅在后续步骤的 env 中）
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # GitHub runner 的机房 IP 会触发网易登录风控（VERIFYCODE.REQ），因此只下载
      # mihomo 内核；配置生成、启动、节点轮换全部由脚本自动管理
      - name: 下载 mihomo 内核
        run: |
          curl -sSL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz"
          gunzip -f mihomo.gz && chmod +x mihomo

      - name: 模拟登录保活
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          # 可选：不设就走直连（不启动 mihomo）；CI 里通常建议设置，见 README「代理」
          CLASH_SUB_URL: ${{ secrets.CLASH_SUB_URL }}
          # 以下都来自仓库 Variables，留空即用脚本默认值
          CLASH_NODE_FILTER: ${{ vars.CLASH_NODE_FILTER }}
          CLASH_MAX_NODES: ${{ vars.CLASH_MAX_NODES }}
          CLASH_TEST_URL: ${{ vars.CLASH_TEST_URL }}
          CLASH_GROUP: ${{ vars.CLASH_GROUP }}
          CLASH_SUB_UA: ${{ vars.CLASH_SUB_UA }}
          CLASH_MIXED_PORT: ${{ vars.CLASH_MIXED_PORT }}
          CLASH_CONTROLLER_PORT: ${{ vars.CLASH_CONTROLLER_PORT }}
          # 只写最小摘要到该文件（完整日志留在 Actions 页面）
          RESULT_FILE: result.txt
        run: |
          if ! node keepalive.mjs; then
            echo "LOGIN_FAILED=1" >> "$GITHUB_ENV"
            exit 1
          fi

      # 失败的运行也照样提交记录（if: always()）；任务整体仍会变红
      - name: 提交运行记录
        if: always()
        run: |
          if [ -n "$(git status --porcelain result.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add result.txt
            if [ "${LOGIN_FAILED:-}" = "1" ]; then
              MSG="keepalive failed @ $(date -u +%F)"
            else
              MSG="keepalive ok @ $(date -u +%F)"
            fi
            git commit -m "$MSG"
            git push
          else
            echo "result.txt 无变化，跳过提交"
          fi
